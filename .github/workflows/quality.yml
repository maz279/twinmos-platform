# TwinMOS Quality Jobs Workflow (QJ-01, T3.7.4)
# Enforces WCAG 2.2 AA accessibility, Lighthouse CI performance budgets (LCP <= 2.5s, CLS <= 0.1),
# CycloneDX SBOM provenance, and OWASP ZAP baseline security without continue-on-error.
name: Quality Jobs & Audits

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC (nightly)
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/admin/**"
      - "deploy/**"
      - "tooling/verify/**"

jobs:
  accessibility-and-performance:
    name: Accessibility & Lighthouse CI Performance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Build Web Application Bundle
        run: npm run build --workspace @twinmos/web

      - name: Start Web SSR Server
        run: |
          PORT=4321 HOST=0.0.0.0 node apps/web/server.mjs &
          sleep 3

      - name: WCAG 2.2 AA Axe-Core Audit (Every Route Reduced & Settled Motion)
        run: node tooling/verify/visual-a11y-audit.mjs

      - name: Run Lighthouse CI Audit (Performance Enforced as Error)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./lighthouserc.json"
          uploadHandler: "temporary-public-storage"

  security-and-sbom:
    name: Security Scan, SBOM & OWASP ZAP (Enforced Thresholds)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM (SBOM-01)
        run: |
          npm sbom --omit=dev --sbom-format=cyclonedx > cyclonedx-sbom.json
          ls -la cyclonedx-sbom.json

      - name: Verify Container & SBOM Isolation
        run: node tooling/verify/verify-container-sbom.mjs

      # ZAP needs a live target: build the web bundle and serve the SSR
      # server on 4321 (same as the Lighthouse job). The ZAP container runs
      # with --network=host, so localhost:4321 is reachable from the scanner.
      - name: Build Web Application Bundle
        run: npm run build --workspace @twinmos/web

      - name: Start Web SSR Server
        run: |
          PORT=4321 HOST=0.0.0.0 node apps/web/server.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:4321/ > /dev/null

      - name: OWASP ZAP Baseline Security Scan (Enforced Without continue-on-error)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          target: "http://localhost:4321/"
          rules_file_name: "deploy/zap/zap-baseline.rules"
          cmd_options: "-m 2"
          allow_issue_writing: false
        continue-on-error: false
