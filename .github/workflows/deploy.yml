# TwinMOS release smoke (DEPLOY-01, T3.7.2)
# Builds the production images and boots the stack (postgres, migrate, bootstrap,
# content, api, web) on the GitHub runner, then smoke-tests it. This is a
# release-candidate check, NOT a deployment: the runner is thrown away at the end.
#
# Zero-trust audit 2026-10-28 (ZT-082): the previous version called itself a
# staging + production deployment, but both jobs ran on ephemeral runners (nothing
# was ever deployed), carried fallback credentials in the file, and ignored its
# inputs. Real staging/production rollout needs a target host and is done with
# deploy/staging/deploy.sh per docs/runbooks/DEPLOY.md until one exists.
name: Release smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    name: Build images + boot stack + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Per-run throwaway secrets (never committed, never reused)
        run: |
          rnd() { openssl rand -hex 24; }
          {
            echo "POSTGRES_USER=twinmos"
            echo "POSTGRES_DB=twinmos"
            echo "POSTGRES_PASSWORD=$(rnd)"
            echo "BETTER_AUTH_SECRET=$(rnd)"
            echo "BETTER_AUTH_URL=https://www.twinmos.com"
            echo "PREVIEW_SIGNING_KEY=$(rnd)"
            echo "REVALIDATE_SECRET=$(rnd)"
            echo "SEED_ADMIN_EMAIL=smoke-admin@twinmos.com"
            echo "SEED_ADMIN_PASSWORD=$(rnd)"
          } > "$RUNNER_TEMP/smoke.env"
          # The boot guard refuses test integrations unless acknowledged; this
          # runner is a throwaway smoke environment with no real mail or captcha.
          {
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
            echo "PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "RESEND_API_KEY=re_smoke_not_a_real_key"
            echo "MAIL_FROM=TwinMOS <no-reply@twinmos.com>"
            echo "FORMS_TO=smoke@twinmos.com"
          } >> "$RUNNER_TEMP/smoke.env"
          echo "C=docker compose -p smoke --env-file $RUNNER_TEMP/smoke.env -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.smoke.yml" >> "$GITHUB_ENV"

      - name: Build images
        run: $C build api web

      - name: Boot postgres → migrate → bootstrap → content → api, web
        run: $C up -d --wait api web

      - name: Smoke
        run: |
          $C exec -T api node -e "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>r.json()).then(j=>{if(j.status!=='ok')process.exit(1)})"
          $C exec -T api node -e "fetch('http://127.0.0.1:8787/api/v1/delivery/products').then(r=>r.json()).then(j=>{if(!Array.isArray(j.data)||!j.data.length)process.exit(1)})"
          $C exec -T web node -e "fetch('http://127.0.0.1:4321/').then(r=>r.text()).then(t=>{if(!/<html/i.test(t))process.exit(1)})"

      - name: Logs on failure
        if: failure()
        run: $C logs --no-color api web migrate bootstrap content | tail -300
