# TwinMOS Continuous Deployment Workflow (DEPLOY-01, T3.7.2, T3.7.3)
# Automates zero-SSH staging rollout in <15 minutes with manual approval gate for production.
name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      rollback_tag:
        description: 'Rollback Release Tag (optional)'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging (<15min, Zero-SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    env:
      NODE_ENV: production
      POSTGRES_USER: twinmos_staging
      POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD || 'staging_secret_pw_123' }}
      POSTGRES_DB: twinmos_staging
      DATABASE_URL: postgresql://twinmos_staging:${{ secrets.STAGING_POSTGRES_PASSWORD || 'staging_secret_pw_123' }}@127.0.0.1:5432/twinmos_staging
      BETTER_AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET || 'staging_better_auth_secret_998877665544' }}
      BETTER_AUTH_URL: https://staging.twinmos.com
      RELEASE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # 1. Build and verify container images with pinned tags
      - name: Build Container Stack with Pinned Digest Tags
        run: |
          echo "[deploy] Building stack images pinned to SHA: ${RELEASE_TAG}"
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.prod.yml build

      # 2. Start PostgreSQL service & wait for readiness
      - name: Start PostgreSQL 18 Service
        run: |
          docker compose -f deploy/compose/docker-compose.yml up -d postgres
          echo "[deploy] Awaiting PostgreSQL 18 health..."
          for i in {1..30}; do
            if docker compose -f deploy/compose/docker-compose.yml exec -T postgres pg_isready -U "${POSTGRES_USER}" >/dev/null 2>&1; then
              echo "[deploy] Database is healthy."
              break
            fi
            sleep 2
          done

      # 3. Run Migrations & Bootstrap Seed
      - name: Run Database Migrations & Bootstrap Seed
        run: |
          docker compose -f deploy/compose/docker-compose.yml run --rm migrate
          docker compose -f deploy/compose/docker-compose.yml run --rm bootstrap

      # 4. Roll out API and Web services
      - name: Deploy API, Web and Edge Services
        run: |
          docker compose -f deploy/compose/docker-compose.yml up -d --no-deps api web edge

      # 5. Automated Smoke Tests (<15m gate)
      - name: Execute Automated Smoke Tests
        run: |
          echo "[deploy] Running smoke checks against deployed stack..."
          # Verify API Health
          docker compose -f deploy/compose/docker-compose.yml exec -T api wget -q -O - http://127.0.0.1:8787/api/v1/health | grep '"status":"ok"'
          # Verify Web SSR Root
          docker compose -f deploy/compose/docker-compose.yml exec -T web wget -q -O - http://127.0.0.1:4321/ | grep -i '<html'
          # Verify Delivery API
          docker compose -f deploy/compose/docker-compose.yml exec -T api wget -q -O - http://127.0.0.1:8787/api/v1/delivery/products | grep '"data"'
          echo "[deploy] Smoke tests passed cleanly."

      # 6. Record Active Release Metadata for Rollback (T3.7.3)
      - name: Record Release Metadata
        run: |
          mkdir -p deploy/staging
          cat <<EOF > deploy/staging/.active_release.json
          {
            "releaseTag": "${RELEASE_TAG}",
            "deployedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "environment": "staging",
            "gitCommit": "${GITHUB_SHA}",
            "status": "healthy"
          }
          EOF
          cat deploy/staging/.active_release.json

  deploy-production:
    name: Production Deployment (Manual Approval Gate)
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Production Rollout
        run: |
          echo "[deploy-prod] Manual approval confirmed. Rolling out release ${{ github.sha }} to production..."
          bash deploy/staging/deploy.sh
