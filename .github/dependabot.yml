# Dependabot Automated Security & Dependency Updates (T3.7.4 / QJ-01)
version: 2
updates:
  # 1. Monorepo Root & Workspace NPM Dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"

  # 2. Container Images & Dockerfiles — one entry per Dockerfile (dependabot's
  # docker ecosystem requires a Dockerfile in the directory; /deploy/compose
  # holds only compose manifests and failed with dependency_file_not_found).
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "UTC"
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "UTC"
  - package-ecosystem: "docker"
    directory: "/deploy/edge"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "UTC"

  # 3. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
