# TwinMOS production edge — nginx on the app VM (Remediated, 2026-10-12).
# One origin serves everything (cookies stay same-site):
#   /            → static Astro bundle (apps/web/dist) / SSR origin
#   /admin/      → static admin bundle (apps/admin/dist, built with base '/admin/')
#   /api/        → Node API (127.0.0.1:8787)
# Cloudflare sits in front (TLS terminates there; this box speaks 80/443).
#
# Security headers live ONLY at server level using a map for CSP, avoiding
# nginx add_header location-level inheritance cancellation (NF-18).

limit_req_zone $binary_remote_addr zone=twinmos_api:10m rate=30r/s;
proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr_cache:10m max_size=100m inactive=60m use_temp_path=off;

upstream ssr_backend {
  server web:4321;
  keepalive 32;
}

upstream api_backend {
  server api:8787;
  keepalive 32;
}


# Real client IP configuration (EDGE-01, EDGE-RIP)
# Official Cloudflare published ranges restore client IP from CF-Connecting-IP:
include /etc/nginx/snippets/realip_cloudflare.conf;

# Structured JSON access log format with request correlation ID (T7.2.1 / MS7.2)
log_format json_combined escape=json '{'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"request_id":"$request_id",'
  '"status":$status,'
  '"request_method":"$request_method",'
  '"request_uri":"$request_uri",'
  '"request_time":$request_time,'
  '"http_referrer":"$http_referer",'
  '"http_user_agent":"$http_user_agent"'
'}';

access_log /var/log/nginx/access.json.log json_combined;

# Bucket size for map hash tables. Must exceed the longest redirect-map key
# (171 chars on 2026-10-28) — at 128 `nginx -t` fails and the edge never starts.
map_hash_bucket_size 256;

# One CSP per area, selected by map so add_header lives ONLY at server level (NF-18).
map $uri $twinmos_csp {
  # The ONE public-site policy (the SSR origin's own CSP header is hidden in @ssr:
  # browsers enforce every CSP they receive, and two policies silently blocked
  # consent-gated analytics and https images). Analytics loads only after consent.
  default   "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  ~^/admin/ "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  ~^/api/   "default-src 'none'; frame-ancestors 'none'";
}

# CMS-managed redirects map (NF-14 / CMS-E1)
map $uri $twinmos_redirect {
  default "";
  include /etc/nginx/twinmos-redirects.map;
}

# tm_preview is the cookie the web app sets (middleware.ts); the old name never
# matched, so editors were served the public micro-cache instead of their preview.
map "$http_x_preview_token:$cookie_tm_preview" $bypass_ssr_cache {
  default 0;
  "~.+:" 1;
  "~:.+" 1;
}

# Container liveness probe: loopback-only, so the public 443 server can keep
# requiring the Cloudflare client certificate (ZT-012).
server {
  listen 127.0.0.1:8081;
  server_tokens off;
  access_log off;
  location = /healthz { return 200 "ok
"; }
  location / { return 404; }
}

# Default drop for unmatched hosts / direct IP access (Origin isolation HARD-01)
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  ssl_certificate     /etc/nginx/certs/twinmos.pem;
  ssl_certificate_key /etc/nginx/certs/twinmos.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 444; # Drop connection immediately without response
}

server {
  listen 80;
  listen [::]:80;
  server_name www.twinmos.com twinmos.com;
  server_tokens off;
  return 301 https://www.twinmos.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  listen [::]:443 ssl;
  server_name twinmos.com;
  server_tokens off;
  ssl_certificate     /etc/nginx/certs/twinmos.pem;
  ssl_certificate_key /etc/nginx/certs/twinmos.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 301 https://www.twinmos.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  listen [::]:443 ssl;
  server_name www.twinmos.com;
  server_tokens off;

  ssl_certificate     /etc/nginx/certs/twinmos.pem;
  ssl_certificate_key /etc/nginx/certs/twinmos.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Cloudflare Authenticated Origin Pulls (AOP - HARD-01 / T7.3.1)
  # Origin requires TLS client cert signed by Cloudflare Origin Pull CA
  ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
  ssl_verify_client on;

  # ---- security headers: server level ONLY (NF-18) ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy $twinmos_csp always;

  if ($twinmos_redirect) { return 301 $twinmos_redirect; }

  root /var/www/twinmos/web;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---- static web assets ----
  # ---- versioned/hashed static assets: 365 days immutable (T3.5.6) ----
  location ~* "^/assets/.*(\.[0-9a-f]{8,}|\bchunks\b|\b_astro\b).*(\.(css|js|png|webp|svg|woff2))$" {
    expires 365d; # (no add_header here: it would cancel the server-level security headers)
    try_files $uri @ssr;
  }

  # ---- unversioned static assets: must revalidate (T3.5.6) ----
  location /assets/ {
    expires -1;
    try_files $uri @ssr;
  }

  # ---- protect internal SSR revalidation endpoints (T3.5.5 item 4: returns 404 from edge) ----
  location ^~ /internal/ {
    return 404;
  }

  location / {
    expires -1;
    try_files $uri $uri/index.html $uri.html @ssr;
  }

  location @ssr {
    proxy_pass http://ssr_backend;
    proxy_http_version 1.1;
    # the server-level headers are the single source; the SSR copies would duplicate them
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Edge micro-cache (CACHE-01 / T3.5.5)
    proxy_cache ssr_cache;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 301 302 5s;
    proxy_cache_valid 404 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_bypass $bypass_ssr_cache;
    proxy_no_cache     $bypass_ssr_cache;

    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
  }

  # ---- admin SPA (NF-02, NF-18) ----
  # Admin document root maps to /var/www/twinmos so /admin/* resolves /var/www/twinmos/admin/*
  location /admin/assets/ {
    root /var/www/twinmos;
    expires 365d;
    try_files $uri =404;
  }
  location /admin/ {
    root /var/www/twinmos;
    expires -1;
    try_files $uri $uri/ /admin/index.html;
  }

  # ---- Private Delivery API endpoints (blocked from public edge - T3.1.3 / MS3.1) ----
  # Delivery API is reachable only on the private loopback (Astro SSR internal calls).
  # Direct public internet requests to private Delivery routes return 403 Forbidden.
  location ~ ^/api/v1/delivery/(pages|articles|news|settings|menus|preview-token|navigation|forms|policies|offices|testimonials|redirects) {
    return 403;
  }

  # ---- operational endpoints are scraped on the internal network only (ZT-010) ----
  location = /api/v1/metrics { return 404; }

  # ---- API reverse proxy ----
  location /api/ {
    limit_req zone=twinmos_api burst=50 nodelay;
    client_max_body_size 1m;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_read_timeout 30s;
  }

  # Media upload endpoint (10MB API cap -> 15MB nginx headroom)
  location ~ ^/api/v1/admin/media$ {
    limit_req zone=twinmos_api burst=20 nodelay;
    client_max_body_size 15m;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id; # never the client's value
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_read_timeout 60s;
  }

  # Serial CSV import endpoint (10MB API cap -> 15MB nginx headroom)
  location = /api/v1/admin/serials/import {
    limit_req zone=twinmos_api burst=20 nodelay;
    client_max_body_size 15m;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id; # never the client's value
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_read_timeout 60s;
  }

  # Partner org asset upload endpoint (25MB API cap -> 30MB nginx headroom)
  location ~ ^/api/v1/admin/partner-orgs/[^/]+/assets$ {
    limit_req zone=twinmos_api burst=20 nodelay;
    client_max_body_size 30m;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id; # never the client's value
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_read_timeout 60s;
  }
}
