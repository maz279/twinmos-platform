# TwinMOS production edge — nginx on the app VM (P7).
# One origin serves everything (cookies stay same-site):
#   /            → static Astro bundle (apps/web/dist)
#   /admin/      → static admin bundle (apps/admin/dist)
#   /api/        → Node API (systemd twinmos-api.service, 127.0.0.1:8787)
# Cloudflare sits in front (TLS terminates there; this box speaks 80/443).

limit_req_zone $binary_remote_addr zone=twinmos_api:10m rate=30r/s;

server {
  listen 80;
  listen [::]:80;
  server_name www.twinmos.com twinmos.com;
  # Behind Cloudflare; redirect everything to https on the edge
  return 301 https://www.twinmos.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name twinmos.com;
  # cert files managed by the VM's certbot/CF origin certificate
  ssl_certificate     /etc/nginx/certs/twinmos.pem;
  ssl_certificate_key /etc/nginx/certs/twinmos.key;
  return 301 https://www.twinmos.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.twinmos.com;

  ssl_certificate     /etc/nginx/certs/twinmos.pem;
  ssl_certificate_key /etc/nginx/certs/twinmos.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # ---- security headers for STATIC surfaces (the API adds its own) ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  root /var/www/twinmos/web;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---- static web: hashed assets cached hard, HTML revalidated ----
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # Pagefind search index
  location /pagefind/ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html $uri.html =404;
  }

  # ---- admin SPA (built bundle; index never cached) ----
  location /admin/ {
    alias /var/www/twinmos/admin/;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /admin/index.html;
  }

  # ---- API reverse proxy ----
  location /api/ {
    limit_req zone=twinmos_api burst=50 nodelay;   # coarse edge guard; app enforces per-route limits
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 30m;                      # media (10MB) + partner files (25MB) + margin
  }
}
