# TwinMOS production edge — nginx on the app VM (P7).
# One origin serves everything (cookies stay same-site):
#   /            → static Astro bundle (apps/web/dist)
#   /admin/      → static admin bundle (apps/admin/dist)
#   /api/        → Node API (systemd twinmos-api.service, 127.0.0.1:8787)
# Cloudflare sits in front (TLS terminates there; this box speaks 80/443).
#
# nginx add_header inheritance rule: a location that declares ANY add_header
# loses ALL inherited server-level add_headers. Therefore cache lifetimes use
# the `expires` directive (which does NOT break add_header inheritance) and the
# security header set lives ONLY at server level.

limit_req_zone $binary_remote_addr zone=twinmos_api:10m rate=30r/s;

server {
  listen 80;
  listen [::]:80;
  server_name www.twinmos.com twinmos.com;
  return 301 https://www.twinmos.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name twinmos.com;
  ssl_certificate     /etc/nginx/certs/twinmos.pem;
  ssl_certificate_key /etc/nginx/certs/twinmos.key;
  return 301 https://www.twinmos.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.twinmos.com;

  ssl_certificate     /etc/nginx/certs/twinmos.pem;
  ssl_certificate_key /etc/nginx/certs/twinmos.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # ---- security headers: server level ONLY (see note above) ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Cloudflare Turnstile (production anti-spam on all public forms) needs:
  #   script-src  → challenges.cloudflare.com/api.js
  #   frame-src   → its verification iframe
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  root /var/www/twinmos/web;
  index index.html;
  error_page 404 /404.html;   # the site's own branded 404 (not nginx's default)

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---- static web: hashed assets cached hard, HTML revalidated ----
  # (expires sets Cache-Control WITHOUT breaking add_header inheritance)
  location /assets/ {
    expires 365d; # sends Cache-Control: max-age=31536000 (immutable files are hashed)
    try_files $uri =404;
  }
  location /pagefind/ {
    expires 1h;
    try_files $uri =404;
  }
  location / {
    expires -1; # no-cache semantics for HTML
    try_files $uri $uri/index.html $uri.html =404;
  }

  # ---- admin SPA (hashed assets cached; index + routes never cached) ----
  # P4.5 CSP step 1: the admin SPA bundles ALL its scripts/styles as external
  # hashed files (Vite output) and uses no Turnstile — so its origin can serve
  # a STRICTER policy than the public web: no 'unsafe-inline' in script-src.
  # (style-src keeps 'unsafe-inline' until the last inline style attribute is
  # extracted — that's roadmap step 2.)
  location /admin/assets/ {
    expires 365d;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri =404;
  }
  location /admin/ {
    expires -1;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri $uri/ /admin/index.html;
  }

  # ---- API reverse proxy (API emits its own header set; nginx adds nothing here) ----
  location /api/ {
    limit_req zone=twinmos_api burst=50 nodelay;   # coarse edge guard; app enforces per-route limits
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 30m;                      # media (10MB) + partner files (25MB) + margin
  }
}
