# TwinMOS production edge — nginx on the app VM (Remediated, 2026-10-12).
# One origin serves everything (cookies stay same-site):
#   /            → static Astro bundle (apps/web/dist) / SSR origin
#   /admin/      → static admin bundle (apps/admin/dist, built with base '/admin/')
#   /api/        → Node API (127.0.0.1:8787)
# Cloudflare sits in front (TLS terminates there; this box speaks 80/443).
#
# Security headers live ONLY at server level using a map for CSP, avoiding
# nginx add_header location-level inheritance cancellation (NF-18).

limit_req_zone $binary_remote_addr zone=twinmos_api:10m rate=30r/s;
proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr_cache:10m max_size=100m inactive=60m use_temp_path=off;

upstream ssr_backend {
  server 127.0.0.1:4321;
  keepalive 32;
}

upstream api_backend {
  server 127.0.0.1:8787;
  keepalive 32;
}

# Real client IP configuration (EDGE-01, EDGE-RIP)
# Official Cloudflare published ranges restore client IP from CF-Connecting-IP:
include /etc/nginx/snippets/realip_cloudflare.conf;
# Private ranges for local test harness / docker lab:
set_real_ip_from 127.0.0.1/32;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# One CSP per area, selected by map so add_header lives ONLY at server level (NF-18).
map $uri $twinmos_csp {
  default   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
  ~^/admin/ "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  ~^/api/   "default-src 'none'; frame-ancestors 'none'";
}

# CMS-managed redirects map (NF-14 / CMS-E1)
map $uri $twinmos_redirect {
  default "";
  include /etc/nginx/twinmos-redirects.map;
}

map "$http_x_preview_token:$cookie_twinmos_preview" $bypass_ssr_cache {
  default 0;
  "~.+:" 1;
  "~:.+" 1;
}

server {
  listen 80;
  listen [::]:80;
  server_name www.twinmos.com twinmos.com;
  server_tokens off;
  return 301 https://www.twinmos.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  listen [::]:443 ssl;
  server_name twinmos.com;
  server_tokens off;
  ssl_certificate     /etc/nginx/certs/twinmos.pem;
  ssl_certificate_key /etc/nginx/certs/twinmos.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 301 https://www.twinmos.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  listen [::]:443 ssl;
  server_name www.twinmos.com;
  server_tokens off;

  ssl_certificate     /etc/nginx/certs/twinmos.pem;
  ssl_certificate_key /etc/nginx/certs/twinmos.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # ---- security headers: server level ONLY (NF-18) ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy $twinmos_csp always;

  if ($twinmos_redirect) { return 301 $twinmos_redirect; }

  root /var/www/twinmos/web;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---- static web assets ----
  location = /assets/js/app.js         { expires -1; try_files $uri =404; }
  location = /assets/js/data.js        { expires -1; try_files $uri =404; }
  location = /assets/js/cms-content.js { expires -1; try_files $uri =404; }
  location = /assets/js/cms-merge.js   { expires -1; try_files $uri =404; }
  location /assets/ {
    expires 365d;
    try_files $uri =404;
  }
  location /pagefind/ {
    expires 1h;
    try_files $uri =404;
  }
  # ---- protect internal SSR revalidation endpoints ----
  location ^~ /internal/ {
    return 403;
  }

  location / {
    expires -1;
    try_files $uri $uri/index.html $uri.html @ssr;
  }

  location @ssr {
    proxy_pass http://ssr_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Edge micro-cache (CACHE-01)
    proxy_cache ssr_cache;
    proxy_cache_valid 200 301 302 5s;
    proxy_cache_valid 404 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_bypass $bypass_ssr_cache;
    proxy_no_cache     $bypass_ssr_cache;

    proxy_read_timeout 10s;
  }

  # ---- admin SPA (NF-02, NF-18) ----
  # Admin document root maps to /var/www/twinmos so /admin/* resolves /var/www/twinmos/admin/*
  location /admin/assets/ {
    root /var/www/twinmos;
    expires 365d;
    try_files $uri =404;
  }
  location /admin/ {
    root /var/www/twinmos;
    expires -1;
    try_files $uri $uri/ /admin/index.html;
  }

  # ---- API reverse proxy ----
  location /api/ {
    limit_req zone=twinmos_api burst=50 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_read_timeout 30s;
  }

  # Media upload endpoint (10MB API cap -> 15MB nginx headroom)
  location ~ ^/api/v1/admin/media$ {
    limit_req zone=twinmos_api burst=20 nodelay;
    client_max_body_size 15m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_read_timeout 60s;
  }

  # Serial CSV import endpoint (10MB API cap -> 15MB nginx headroom)
  location = /api/v1/admin/serials/import {
    limit_req zone=twinmos_api burst=20 nodelay;
    client_max_body_size 15m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_read_timeout 60s;
  }

  # Partner org asset upload endpoint (25MB API cap -> 30MB nginx headroom)
  location ~ ^/api/v1/admin/partner-orgs/[^/]+/assets$ {
    limit_req zone=twinmos_api burst=20 nodelay;
    client_max_body_size 30m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_read_timeout 60s;
  }
}
