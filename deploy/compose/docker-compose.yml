services:
  edge:
    build:
      context: ../..
      dockerfile: deploy/edge/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - twinmos_internal
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - API_URL=http://api:8787
      - DELIVERY_API_URL=http://api:8787/api/v1/delivery
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      # read per request by Layout.astro (public key, rendered into the page)
      - PUBLIC_TURNSTILE_SITE_KEY=${PUBLIC_TURNSTILE_SITE_KEY}
    depends_on:
      api:
        condition: service_healthy
      content:
        condition: service_completed_successfully
    networks:
      - twinmos_internal
    expose:
      - "4321"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - twinmos_internal
    command: ["node", "--experimental-strip-types", "scripts/migrate.ts"]
    restart: "no"

  bootstrap:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://www.twinmos.com}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@twinmos.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - BOOTSTRAP_SEED=1
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - twinmos_internal
    command: ["node", "--experimental-strip-types", "scripts/seed.ts", "--bootstrap"]
    restart: "no"

  # Reviewed CMS content snapshot (apps/api/content/snapshot, CORRECTIONS.md).
  # --if-empty: never touches a database that already has catalogue content.
  content:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      - twinmos_internal
    command: ["node", "--experimental-strip-types", "--no-warnings", "scripts/load-content.ts", "--if-empty"]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8787
      - TRUST_PROXY=1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://www.twinmos.com}
      - PREVIEW_SIGNING_KEY=${PREVIEW_SIGNING_KEY}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - PUBLIC_TURNSTILE_SITE_KEY=${PUBLIC_TURNSTILE_SITE_KEY}
      - INTERNAL_WEB_URL=http://web:4321
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - FORMS_TO=${FORMS_TO}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://www.twinmos.com}
      # uploaded CMS media and partner assets: persistent volume, never the
      # container FS or tmpfs (ZT-077 — they used to vanish on every restart)
      - MEDIA_DIR=/app/apps/api/data/media
      - PARTNER_FILES_DIR=/app/apps/api/data/partner-files
    volumes:
      - api_files:/app/apps/api/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - twinmos_internal
    # S-11 / SEC-C1: Expose internally to edge & web, do NOT bind host port
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    # ZT-079: continuous WAL archiving cuts RPO from 24 h (nightly pg_dump) to
    # ≤15 min. Segments land in a postgres-owned dir on the pgdata volume
    # (a separate named volume would be root-owned and unwritable); the
    # nightly backup copies them off-site and retention prunes them.
    # archive_command is idempotent (test ! -f) so restarts never clobber.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /var/lib/postgresql/wal_archive && test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
      - -c
      - archive_timeout=900
      - -c
      - wal_level=replica
    networks:
      - twinmos_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  twinmos_internal:
    driver: bridge

volumes:
  pgdata:
  api_files:

