services:
  edge:
    build:
      context: ../..
      dockerfile: deploy/edge/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
    networks:
      - twinmos_internal
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - DELIVERY_API_URL=http://api:8787/api/v1/delivery
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-prod-revalidation-secret-key-32ch}
    depends_on:
      - api
    networks:
      - twinmos_internal
    expose:
      - "4321"
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-twinmos}:${POSTGRES_PASSWORD:-twinmos_secure_pwd}@postgres:5432/${POSTGRES_DB:-twinmos}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://www.twinmos.com
      - PREVIEW_SIGNING_KEY=${PREVIEW_SIGNING_KEY:-preview-hmac-sha256-signing-key-32chars}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-prod-revalidation-secret-key-32ch}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - twinmos_internal
    # S-11 / SEC-C1: Expose internally to edge & web, do NOT bind host port
    expose:
      - "8787"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-twinmos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-twinmos_secure_pwd}
      - POSTGRES_DB=${POSTGRES_DB:-twinmos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - twinmos_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twinmos} -d ${POSTGRES_DB:-twinmos}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  twinmos_internal:
    driver: bridge

volumes:
  pgdata:
