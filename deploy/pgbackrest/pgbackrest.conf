# ==============================================================================
# pgBackRest Configuration — TwinMOS Production PostgreSQL 18 (T7.1.2)
# NOT wired into the docker compose deployment yet: nothing applies
# postgresql.conf.fragment (archive_command) and the paths below are for a
# host-installed PostgreSQL. Until it is set up and drilled, RPO = 24 h
# (deploy/backup.sh nightly). Intended: WAL archiving (RPO <= 15 min).
# Stanza: twinmos
# ==============================================================================

[global]
repo1-type=posix
repo1-path=/var/backups/twinmos/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass comes from the environment (PGBACKREST_REPO1_CIPHER_PASS);
# pgBackRest does not expand ${...} here, so a fallback in this file was the
# literal key, committed to the repo (ZT-079).
process-max=4
log-level-console=info
log-level-file=detail
start-fast=y
compress-type=lz4
compress-level=3

[global:archive-push]
compress-level=3

[twinmos]
pg1-path=/var/lib/postgresql/18/main
pg1-port=5432
pg1-user=postgres
pg1-database=twinmos_prod
