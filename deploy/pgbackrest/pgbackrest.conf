# ==============================================================================
# pgBackRest Configuration — TwinMOS Production PostgreSQL 18 (T7.1.2)
# Manages continuous WAL archiving (RPO <= 15 min) and scheduled base backups.
# Stanza: twinmos
# ==============================================================================

[global]
repo1-type=posix
repo1-path=/var/backups/twinmos/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${PGBACKREST_CIPHER_PASS:-TwinMOS-Secure-Backup-Key-2026}
process-max=4
log-level-console=info
log-level-file=detail
start-fast=y
compress-type=lz4
compress-level=3

[global:archive-push]
compress-level=3

[twinmos]
pg1-path=/var/lib/postgresql/18/main
pg1-port=5432
pg1-user=postgres
pg1-database=twinmos_prod
