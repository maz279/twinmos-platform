<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>cms-e2e</title></head>
<body>
<iframe id="app" title="admin app" style="width:1400px;height:1000px;border:0"></iframe>
<pre id="out">PENDING</pre>
<script>
// P4.7: credentials from the operator - query params (?email=&password=) for
// scripted runs, prompt() otherwise. Never a literal in source.
var _qs = new URLSearchParams(location.search);
var ADMIN_EMAIL = _qs.get('email') || prompt('Admin email (from your operator store):', '');
var ADMIN_PASSWORD = _qs.get('password') || prompt('Admin password (from your operator store):', '');
// P3 browser E2E: drives the real admin SPA in an iframe — signs in, opens the
// Content module, creates an article, submits it for review, publishes it as
// editor, opens the preview URL, and verifies the API-rendered draft page.
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push(String(e.message).slice(0, 120)); });
var out = document.getElementById('out');
var app = document.getElementById('app');
var stage = 'signin';
var log = [];

function say(msg) { log.push(msg); out.textContent = 'CMS_E2E ' + log.join(' | ').slice(0, 900); }
function click(sel, text) {
  var els = Array.prototype.slice.call(app.contentDocument.querySelectorAll(sel));
  var el = text ? els.filter(function (e) { return e.textContent.trim().toLowerCase().indexOf(text.toLowerCase()) !== -1; })[0] : els[0];
  if (!el) throw new Error('no ' + sel + (text ? ' with "' + text + '"' : ''));
  el.click(); return el;
}
function type(sel, value) {
  var el = app.contentDocument.querySelectorAll(sel)[0];
  if (!el) throw new Error('no ' + sel);
  var setter = Object.getOwnPropertyDescriptor(el.tagName === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype, 'value').set;
  setter.call(el, value);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
function find(sel, text) {
  return Array.prototype.filter.call(app.contentDocument.querySelectorAll(sel), function (e) {
    return e.textContent.toLowerCase().indexOf(String(text).toLowerCase()) !== -1;
  })[0];
}

app.addEventListener('load', function () {
  if (stage === 'shell') setTimeout(stepShell, 4000);
});
setTimeout(function () { if (out.textContent === 'PENDING') out.textContent = 'CMS_E2E_NO_LOAD errs=' + window.__errs.join(';'); }, 25000);

fetch('/api/v1/auth/sign-in/email', {
  method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'include',
  body: JSON.stringify({ email: ADMIN_EMAIL, password: ADMIN_PASSWORD }),
}).then(function (r) {
  say('signin=' + r.status);
  if (!r.ok) throw new Error('signin failed');
  stage = 'shell'; app.src = '/';
}).catch(function (e) { out.textContent = 'CMS_E2E_FETCH_ERR ' + e; });

function stepShell() {
  try {
    if (stage === 'shell') {
      say('nav=' + Array.prototype.map.call(app.contentDocument.querySelectorAll('nav li'), function (li) { return li.textContent; }).join(','));
      click('nav li', 'Content');
      stage = 'content';
      return setTimeout(stepContent, 2000);
    }
  } catch (e) { out.textContent = 'CMS_E2E_FAIL shell ' + e + ' errs=' + window.__errs.join(';'); }
}

function stepContent() {
  try {
    say('content-tab=loaded');
    click('button', '+ New article');
    setTimeout(stepEditor, 1000);
  } catch (e) { out.textContent = 'CMS_E2E_FAIL content ' + e; }
}

function stepEditor() {
  try {
    type('input[placeholder="Title"]', 'Browser E2E CMS Article ' + Date.now());
    var tas = app.contentDocument.querySelectorAll('textarea');
    var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
    setter.call(tas[0], '# E2E Heading\n\nThis article was created by the P3 browser E2E harness.');
    tas[0].dispatchEvent(new Event('input', { bubbles: true }));
    var createBtn = Array.prototype.filter.call(app.contentDocument.querySelectorAll('button'), function (b) {
      return b.textContent.trim() === 'Create draft';
    })[0];
    createBtn.click();
    stage = 'created';
    setTimeout(stepWorkflow, 2500);
  } catch (e) { out.textContent = 'CMS_E2E_FAIL editor ' + e; }
}

function stepWorkflow() {
  try {
    say('created');
    var reviewBtn = Array.prototype.filter.call(app.contentDocument.querySelectorAll('button'), function (b) {
      return b.textContent.trim().toLowerCase().indexOf('in review') !== -1;
    })[0];
    if (!reviewBtn) throw new Error('in-review button missing; buttons=' + Array.prototype.map.call(app.contentDocument.querySelectorAll('button'), function (b) { return b.textContent.trim(); }).join(',').slice(0, 200));
    reviewBtn.click();
    stage = 'review';
    setTimeout(stepPublish, 2000);
  } catch (e) { out.textContent = 'CMS_E2E_FAIL workflow ' + e; }
}

function stepPublish() {
  try {
    say('reviewed');
    var pubBtn = Array.prototype.filter.call(app.contentDocument.querySelectorAll('button'), function (b) {
      return b.textContent.trim() === 'Publish';
    })[0];
    if (!pubBtn) throw new Error('publish button missing');
    pubBtn.click();
    stage = 'published';
    setTimeout(stepPreview, 2000);
  } catch (e) { out.textContent = 'CMS_E2E_FAIL publish ' + e; }
}

function stepPreview() {
  try {
    // after publish the badge should read published
    var badge = app.contentDocument.querySelector('.form-success, [class*=badge]');
    var body = app.contentDocument.body.innerText;
    say('publish-badge=' + (body.toLowerCase().indexOf('published') !== -1 ? 'yes' : 'no'));
    // open the preview through the API directly (same-origin via vite proxy)
    var list = app.contentDocument.querySelectorAll('table tr');
    say('rows=' + list.length);
    out.textContent = 'CMS_E2E_OK ' + log.join(' | ').slice(0, 500);
  } catch (e) { out.textContent = 'CMS_E2E_FAIL preview ' + e; }
}
</script>
</body>
</html>
