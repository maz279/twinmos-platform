<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>i18n-admin-e2e</title></head>
<body>
<iframe id="app" title="admin app" style="width:1400px;height:1000px;border:0"></iframe>
<pre id="out">PENDING</pre>
<script>
// P4 admin Translations module E2E: signs in, opens Translations, imports a
// test string via the JSON import box, and verifies it appears in the grid.
window.__errs = [];
window.addEventListener('error', function (e) { window.__errs.push(String(e.message).slice(0, 100)); });
var out = document.getElementById('out');
var app = document.getElementById('app');
var stage = 'signin';
var log = [];
function say(m) { log.push(m); out.textContent = 'I18N_ADMIN ' + log.join(' | ').slice(0, 700); }
function btn(text) {
  return Array.prototype.filter.call(app.contentDocument.querySelectorAll('button'), function (b) {
    return b.textContent.trim().toLowerCase().indexOf(text.toLowerCase()) !== -1;
  })[0];
}
app.addEventListener('load', function () { if (stage === 'shell') setTimeout(stepShell, 4000); });
fetch('/api/v1/auth/sign-in/email', {
  method: 'POST', headers: { 'content-type': 'application/json' }, credentials: 'include',
  body: JSON.stringify({ email: 'admin@twinmos.dev', password: 'DevOnly-ChangeMe-2026!' }),
}).then(function (r) { say('signin=' + r.status); stage = 'shell'; app.src = '/'; })
  .catch(function (e) { out.textContent = 'I18N_ADMIN_ERR ' + e; });

function stepShell() {
  try {
    say('nav=' + Array.prototype.map.call(app.contentDocument.querySelectorAll('nav li'), function (li) { return li.textContent; }).join(',').slice(0, 120));
    var t = Array.prototype.filter.call(app.contentDocument.querySelectorAll('nav li'), function (li) { return li.textContent.indexOf('Translations') !== -1; })[0];
    if (!t) throw new Error('no Translations nav item');
    t.click();
    setTimeout(stepModule, 2500);
  } catch (e) { out.textContent = 'I18N_ADMIN_FAIL shell ' + e + ' errs=' + window.__errs.join(';'); }
}
function stepModule() {
  try {
    var d = app.contentDocument;
    var localeSel = d.querySelector('select');
    if (!localeSel) throw new Error('no locale select');
    // default locale is ar per the module; verify the import box exists
    var tas = d.querySelectorAll('textarea');
    if (!tas.length) throw new Error('no import textarea');
    var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
    setter.call(tas[0], JSON.stringify({ 'test.e2e.key': 'قيمة الاختبار ' + Date.now() }));
    tas[0].dispatchEvent(new Event('input', { bubbles: true }));
    var importBtn = btn('Import strings');
    if (!importBtn) throw new Error('no import button');
    importBtn.click();
    setTimeout(stepVerify, 3000);
  } catch (e) { out.textContent = 'I18N_ADMIN_FAIL module ' + e; }
}
function stepVerify() {
  try {
    var d = app.contentDocument;
    var body = d.body.innerText;
    var imported = body.indexOf('Imported 1 strings') !== -1 || body.indexOf('Imported') !== -1;
    var keySeen = body.indexOf('test.e2e.key') !== -1;
    out.textContent = (imported && keySeen ? 'I18N_ADMIN_OK ' : 'I18N_ADMIN_PARTIAL ') + log.join(' | ') +
      ' imported=' + imported + ' keyInGrid=' + keySeen + ' errs=' + window.__errs.join(';');
  } catch (e) { out.textContent = 'I18N_ADMIN_FAIL verify ' + e; }
}
</script>
</body>
</html>
